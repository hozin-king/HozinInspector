plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hozinking.appinspector'
    compileSdk 34

    defaultConfig {
        applicationId "com.hozinking.appinspector"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // jsoup (MIT) — parsing HTML untuk Web Scraper
    implementation 'org.jsoup:jsoup:1.17.2'
    // readability4j (Apache-2.0) — ekstrak isi artikel bersih untuk Reader
    implementation 'net.dankito.readability4j:readability4j:1.0.8'
    // Xposed API disediakan LSPosed saat runtime — hanya untuk kompilasi
    compileOnly 'de.robv.android.xposed:api:82'
}
